<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %} — HudHud Web</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
        nav { margin-bottom: 2rem; }
        nav a { margin-right: 1rem; color: #2563eb; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.875rem; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Ana Sayfa</a>
        <a href="/profil">Profil</a>
        <a href="/api/hello">API</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>HudHud Web Framework &mdash; Flask-grade template engine</p>
    </footer>
</body>
</html>
