# default = "deny"
#
# [host_access.env]
# default = "deny"
# allow = ["DEEPSEEK_API_KEY", "OPENAI_API_KEY"]
#
# [host_access.exec]
# default = "deny"
# allow = ["rg"]
# deny = ["git", "bash", "sh", "zsh", "sudo"]
# max_processes = 4
#
# [host_access.modules]
# default = "deny"
