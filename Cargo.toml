[workspace.package]
version = "0.8.223"
edition = "2021"
authors = ["Onur GÜZEL"]
license = "MIT"
repository = "https://github.com/HudHudMind/hudhudscript"
readme = "README.md"

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

# HTTP client — single version for all crates (issue #158).
# Individual crates may add extra features (e.g. "blocking", "stream") via
# `reqwest = { workspace = true, features = ["blocking"] }`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Parser
pest = "2.7"
pest_derive = "2.7"

# Native FFI
libloading = "0.8"

# Testing
proptest = "1.0"
async-trait = "0.1"

# Benchmarking
criterion = "0.5"

# Faster synchronization primitives
parking_lot = "0.12"

# Faster hashing (interpreter hot paths)
rustc-hash = "2.1"

# Serialization formats (v0.4.38 — Batch 1)
serde_yaml = "0.9"
csv = "1.3"
base64 = "0.22"
urlencoding = "2.1"

# Stdlib basics (v0.4.38 — Batch 2)
url = "2.5"
glob = "0.3"
tempfile = "3.8"

# Network (v0.4.38 — Batch 6)
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Semantic versioning
semver = "1.0"

# Cryptographic hashing (used for cache checksums)
sha2 = "0.10"
hex = "0.4"

# The shared `hudhudscript-errors` crate (issue #158 / #321) provides common
# error types (SourcePosition, Diagnostic, Severity, HudHudError) so that
# individual crates do not have to define error infrastructure from scratch.
# Migration is incremental — crates adopt it by adding From conversions.

# TODO(#158): Implement an AST visitor trait in `hudhudscript-ast` so that
# passes (formatter, type-checker, linter, …) can walk the tree without
# duplicating manual recursion in each crate.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
panic = "abort"

[profile.release-prof]
inherits = "release"
strip = false

# LSP istek-izolasyonu için: panic yakalanabilir olmalı (catch_unwind abort'ta çalışmaz).
# Diğer binary'ler abort kalır; SADECE LSP bu profille derlenir.
[profile.lsp]
inherits = "release"
panic = "unwind"
debug = true
lto = false

[profile.dev]
opt-level = 0
debug = true
