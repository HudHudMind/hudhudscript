[package]
name = "hudhudscript-tools-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "I/O tools for HudHudScript — standard tools, database operations"

[features]
default = []
db = ["dep:sqlx", "dep:base64", "dep:bigdecimal", "dep:chrono", "dep:futures", "dep:sha2"]

[dependencies]
hudhudscript-errors = { path = "../hudhudscript-errors" }
hudhudscript-tools-schema = { path = "../hudhudscript-tools-schema" }
hudhudscript-tools-vcs = { path = "../hudhudscript-tools-vcs" }
hudhudscript-sandbox = { path = "../hudhudscript-sandbox" }
serde.workspace = true
url.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = { workspace = true, optional = true }
bigdecimal = { version = "0.4", optional = true }
chrono = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "bigdecimal"], optional = true }

[dev-dependencies]
proptest.workspace = true
toml.workspace = true
