[package]
name = "hudhudscript-tools-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "I/O tools for HudHudScript — standard tools, database operations"

[features]
default = []
db = ["dep:sqlx"]

[dependencies]
hudhudscript-errors = { path = "../hudhudscript-errors" }
hudhudscript-tools-schema = { path = "../hudhudscript-tools-schema" }
hudhudscript-tools-vcs = { path = "../hudhudscript-tools-vcs" }
hudhudscript-sandbox = { path = "../hudhudscript-sandbox" }
serde.workspace = true
url.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "macros"], optional = true }

[dev-dependencies]
proptest.workspace = true
