[package]
name = "hudhudscript-bytecode"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Bytecode format, instruction set, and value types for HudHudScript"

[dependencies]
hudhudscript-errors = { path = "../hudhudscript-errors" }
serde = { workspace = true }
serde_json = { workspace = true }
# postcard 1.x: varint-encoded binary format.  SOLE production wire encoding
# for `.hudb` / `.hudc` caches as of BYTECODE_VERSION v8 (PERF-49, Audit v3
# Finding 15.1) — typically 40-60% smaller than bincode's fixed-width layout.
postcard = { version = "1.0", features = ["use-std"] }
thiserror = { workspace = true }
parking_lot = { version = "0.12", features = ["serde"] }
rustc-hash = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
sptr = "0.3.2"

[features]
# GC allocation/pause counters in `gc.rs` (take_telemetry_alloc_counts,
# take_telemetry_gc_stats). Off by default so the counters cost nothing in a
# normal build; the chain that turns them on is
# hudhudscript-cli/telemetry → hudhudscript-vm/telemetry → here.
telemetry = []

[dev-dependencies]
criterion = { workspace = true }


[[bench]]
name = "instruction_bench"
harness = false
