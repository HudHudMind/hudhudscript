[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hudhudscript"
version = "0.1.21"
description = "HudHudScript - Multi-lingual programming language with agent orchestration"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["programming-language", "multi-lingual", "agent", "orchestration", "mcp"]
authors = [
    {name = "Onur GÜZEL", email = "info@hudhudmind.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://hudhudscript.org"
Repository = "https://github.com/HudHudMind/hudhud-script"
Documentation = "https://hudhudscript.org/docs"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hudhudscript"
