[package]
name = "hudhud-ffi"
version.workspace = true
edition.workspace = true
description = "C FFI bindings for HudHudScript VM"

[lib]
# `lib` (rlib) target enables integration tests; cdylib/staticlib outputs
# for C/Dart embedders are unchanged.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
hudhudscript-vm = { path = "../hudhudscript-vm" }
hudhudscript-bytecode = { path = "../hudhudscript-bytecode" }
hudhudscript-compiler = { path = "../hudhudscript-compiler" }
hudhudscript-parser = { path = "../hudhudscript-parser" }
hudhudscript-errors = { path = "../hudhudscript-errors" }
