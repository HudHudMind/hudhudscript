[package]
name = "hudhudscript-hudunit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Unit test framework for the HudHudScript language (hudunit binary)"

[lib]
name = "hudhudscript_hudunit"
path = "src/lib.rs"

[[bin]]
name = "hudunit"
path = "src/bin/hudunit.rs"

[dependencies]
hudhudscript-ast = { path = "../hudhudscript-ast" }
hudhudscript-parser = { path = "../hudhudscript-parser" }
hudhudscript-compiler = { path = "../hudhudscript-compiler" }
hudhudscript-formatter = { path = "../hudhudscript-formatter" }
hudhudscript-bytecode = { path = "../hudhudscript-bytecode" }
hudhudscript-vm = { path = "../hudhudscript-vm" }
hudhudscript-errors = { path = "../hudhudscript-errors" }
hudhud-print = { path = "../hudhud-print" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
